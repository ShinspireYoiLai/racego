           <textarea rows="3" maxlength="200" placeholder="寫下想對他們說的話，例如：從小看你們打球長大，這次一定要拿下冠軍！" aria-label="應援留言">${o.msg ? esc(o.msg) : ""}</textarea>
           <div class="cheer-foot"><span class="hint">最多 200 字・訂單或寄送等個人問題，請直接聯繫提案方</span>
             <span class="cheer-btns">${o.msg ? '<button type="button" class="btn-ghost sm" data-cheer-cancel>取消</button>' : ""}<button type="button" class="btn-primary sm" data-cheer-save>${o.msg ? "儲存" : "送出應援"}</button></span></div>`
        : `<p class="cheer-text">${esc(o.msg)}</p>`}
    </section>`;
  }
  document.addEventListener("click", e => {
    const box = e.target.closest("[data-cheer-order]");
    if (!box) return;
    const o = ORDERS.find(x => x.no === box.dataset.cheerOrder);
    const redraw = () => { box.outerHTML = cheerHTML(o); };
    if (e.target.closest("[data-cheer-edit]")) { cheerEditing.add(o.no); redraw(); document.querySelector(`[data-cheer-order="${o.no}"] textarea`)?.focus(); return; }
    const qk = e.target.closest("[data-cheer-quick]");
    if (qk) { const ta = box.querySelector("textarea"); ta.value = (ta.value.trim() ? ta.value.trim() + " " : "") + qk.dataset.cheerQuick; ta.focus(); return; }
    if (e.target.closest("[data-cheer-cancel]")) { cheerEditing.delete(o.no); redraw(); return; }
    if (e.target.closest("[data-cheer-save]")) {
      const v = box.querySelector("textarea").value.trim();
      if (!v) { box.querySelector("textarea").focus(); toast("請輸入應援內容"); return; }
      const had = !!o.msg;
      o.msg = v;
      if (!o.backer) {
        const nm = o.contact.name;
        o.backer = { name: o.anon ? "匿名支持者" : nm[0] + "*" + nm.slice(-1), plans: o.cart.map(c => c.id), donation: o.donation > 0, date: o.time.slice(0, 10) };
        BACKERS.unshift(o.backer);
      }
      o.backer.msg = v;
      cheerEditing.delete(o.no); redraw(); toast(had ? "應援留言已更新" : "應援留言已送出");
    }
  });

  function renderOrderDetail() {
    renderSide("orders");
    const o = ORDERS.find(x => x.no === currentOrderNo) || ORDERS[0];
    const t = orderTotals(o), ok = o.status === "paid";
    const row = (k, v) => `<div class="kv"><dt>${k}</dt><dd>${v}</dd></div>`;
    const lines = o.cart.map(c => {
      const p = PLANS.find(x => x.id === c.id);
      return `<tr>
        <td><div class="od-item"><div class="thumb" style="background:linear-gradient(135deg,${p.c1},${p.c2})">${p.emoji}</div>
          <div><div class="nm">方案 ${p.id}｜${p.name}</div><div class="od-sub">${p.items.join("、")}</div>
          <div class="od-ship">${ic.time}寄送時間：${p.shipTime}</div></div></div></td>
        <td class="num-c" data-k="單價">${fmt(p.price)}</td><td class="num-c" data-k="數量">${c.qty}</td><td class="num-c" data-k="小計">${fmt(p.price * c.qty)}</td></tr>`;
    }).join("") + (o.donation ? `<tr>
        <td><div class="od-item"><div class="thumb donate-thumb">${ic.heartFill}</div><div><div class="nm">自由贊助</div><div class="od-sub">無回饋品</div></div></div></td>
        <td class="num-c" data-k="單價">${fmt(o.donation)}</td><td class="num-c" data-k="數量">1</td><td class="num-c" data-k="小計">${fmt(o.donation)}</td></tr>` : "");

    // 發票：購物車有方案才有；收據：一律顯示
    const inv = o.invoice, rc = o.receipt;
    let invRows = "";
    if (inv) {
      invRows = row("發票類型", INV_LABEL[inv.type]);
      if (inv.type === "carrier") invRows += row("手機條碼", inv.carrier);
      if (inv.type === "paper") invRows += row("寄送地址", `${inv.city}${inv.addr}`);
      if (inv.type === "company") invRows += row("公司抬頭", inv.title) + row("統一編號", inv.tax);
      if (inv.type === "donate") invRows += row("愛心碼", inv.love);
    }
    const rcRows = rc && !inv ? row("收據", rc.need ? "需要" : "不需要") + (rc.need ? row("收據抬頭", rc.title) + row("身分證字號／統編", maskId(rc.id)) : "") : "";
    const invTitle = inv ? "發票" : "收據";

    const sh = o.ship;
    const shipCard = t.method ? `
      <section class="od-card">
        <h2>寄送資訊</h2>
        <dl>${ok ? row("出貨狀態", `<span class="ship-status ${o.shipStatus}">${o.shipStatus === "shipped" ? "已出貨" : "待出貨"}</span>`) : ""}${ok && o.shipStatus === "shipped" && o.shipDate ? row("出貨日期", o.shipDate) : ""}${ok && o.shipStatus === "shipped" && carrierOf(o, t) ? row("物流業者", carrierOf(o, t)) : ""}${ok && o.shipStatus === "shipped" && o.trackingNo ? row("物流單號", `${o.trackingNo}<span class="od-hint">可至${carrierOf(o, t) || "物流業者"}官網查詢配送進度</span>`) : ""}${row("寄送方式", t.method.name)}${row("收件人", sh.name)}${row("收件人手機", sh.phone)}
          ${t.method.store ? row("取貨門市", sh.store) : row("寄送地址", `${sh.city}${sh.addr}`)}</dl>
      </section>` : "";

    document.getElementById("orderMain").innerHTML = `
      <a href="#orders" data-view="orders" class="pj-back"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform:rotate(90deg)"><path d="m6 9 6 6 6-6"/></svg>回到群募紀錄</a>
      <div class="od-head">
        <div><h1>訂單明細</h1><p>訂單編號 ${o.no}</p></div>
        <span class="pay-status big ${o.status}">${STATUS[o.status]}</span>
      </div>
      ${ok ? "" : `<div class="od-alert">${icx.info}<div><strong>信用卡付款失敗，本筆訂單已取消</strong><p>未扣款，回饋品亦不會寄出。如仍要支持此專案，請重新贊助。</p></div></div>`}

      <div class="od-grid">
        <section class="od-card">
          <h2>訂單資訊</h2>
          <dl>${row("訂單編號", o.no)}${row("下單時間", o.time)}${row("付款方式", "信用卡")}
            ${row("付款狀態", `<span class="pay-status ${o.status}">${STATUS[o.status]}</span>`)}
            ${ok ? row("付款時間", o.time) : row("訂單狀態", "已取消")}</dl>
        </section>
        <section class="od-card">
          <h2>贊助專案</h2>
          <div class="od-proj">
            <div class="order-thumb" style="background:linear-gradient(135deg,${o.fund.sport.c1},${o.fund.sport.c2})">${o.fund.sport.emoji}</div>
            <div><div class="nm"><a href="#project" data-view="project" data-id="${o.fund.id}">${o.fund.title}</a></div>
              <div class="od-sub">${o.fund.type === "event" ? "賽事募資" : "選手募資"}・提案方名稱</div></div>
          </div>
        </section>
      </div>

      <section class="od-card">
        <h2>贊助明細</h2>
        <div class="od-table-wrap"><table class="od-table">
          <thead><tr><th>項目</th><th class="num-c">單價</th><th class="num-c">數量</th><th class="num-c">小計</th></tr></thead>
          <tbody>${lines}</tbody>
        </table></div>
        <div class="od-sum">
          ${o.cart.length ? `<div><span>方案小計</span><span>${fmt(t.items)}</span></div>` : ""}
          ${o.donation ? `<div><span>自由贊助</span><span>${fmt(t.donation)}</span></div>` : ""}
          <div><span>運費${t.method ? `（${t.method.name}）` : ""}</span><span>${t.ship ? fmt(t.ship) : "無需寄送"}</span></div>
          <div class="sum"><span>訂單金額</span><strong>${fmt(t.total)}</strong></div>
        </div>
      </section>

      <div class="od-grid">
        <section class="od-card">
          <h2>聯絡人資料</h2>
          <dl>${row("姓名", o.contact.name)}${row("手機", o.contact.phone)}${row("Email", o.contact.email)}</dl>
        </section>
        ${shipCard || `<section class="od-card"><h2>寄送資訊</h2><p class="od-none">本訂單無實體回饋品，不需寄送</p></section>`}
        <section class="od-card">
          <h2>${invTitle}</h2>
          <dl>${invRows}${rcRows}</dl>
        </section>
        <section class="od-card">
          <h2>其他</h2>
          <dl>${row("匿名贊助", o.anon ? "是（贊助名單顯示為「匿名支持者」）" : "否")}${row("備註給提案方", o.note ? o.note.replace(/</g, "&lt;") : "—")}</dl>
        </section>
      </div>

      ${ok ? cheerHTML(o) : ""}
      <div class="od-actions">
        ${ok ? "" : `<a href="#project" data-view="project" data-id="${o.fund.id}" class="btn-primary">重新贊助</a>`}
        <a href="#project" data-view="project" data-id="${o.fund.id}" class="btn-ghost">前往專案頁</a>
      </div>`;
  }

  /* ================= 頁面切換（#crowdfunding / #favorites） ================= */
  // 直接以 JS 切換頁面，不依賴網址變化（預覽環境中 hash 連結可能無作用）
  let currentView = "crowdfunding";
  function route(view) {
    clearInterval(cdTimer);
    document.body.classList.remove("mbar-on", "typing");
    if (payObserver) { payObserver.disconnect(); payObserver = null; }
    const VIEWS = ["crowdfunding", "favorites", "orders", "order", "project"];
    view = view || (VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "crowdfunding");
    if (!isLoggedIn && ["favorites", "orders", "order"].includes(view)) view = "crowdfunding";
    currentView = view;
    document.getElementById("viewList").hidden = view !== "crowdfunding";
    document.getElementById("viewFav").hidden = !["favorites", "orders", "order"].includes(view);
    document.getElementById("viewProject").hidden = view !== "project";
    document.getElementById("favMain").hidden = view !== "favorites";
    document.getElementById("ordersMain").hidden = view !== "orders";
    document.getElementById("orderMain").hidden = view !== "order";
    const navCf = document.getElementById("navCf");
    navCf.classList.toggle("active", view === "crowdfunding" || view === "project");
    view === "crowdfunding" ? navCf.setAttribute("aria-current", "page") : navCf.removeAttribute("aria-current");
    document.title = ({ crowdfunding: "群眾募資", favorites: "我的收藏", orders: "群募紀錄", order: "訂單明細", project: "群募專案" })[view] + "｜競賽咖 RaceGo";
    ({ crowdfunding: renderList, favorites: renderFav, orders: renderOrders, order: renderOrderDetail, project: renderProject })[view]();
    document.getElementById("header").classList.remove("open");
    closeMember();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => route());
  document.addEventListener("click", e => {
    const v = e.target.closest("[data-view]");
    if (!v) return;
    e.preventDefault();
    if (v.dataset.view === "favorites" && v.closest(".member-menu")) favState.tab = "event";
    if (v.dataset.view === "project") openProject(Number(v.dataset.id) || pj.id);
    if (v.dataset.view === "order") currentOrderNo = v.dataset.order;
    try { history.replaceState(null, "", "#" + v.dataset.view); } catch (err) {}
    route(v.dataset.view);
  }, true);

  /* ================= 登入狀態（原型示意：登出／登入可切換） ================= */
  function renderAuth() {
    document.getElementById("member").hidden = !isLoggedIn;
    document.getElementById("guestBox").hidden = isLoggedIn;
  }
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-auth]");
    if (!a) return;
    e.preventDefault(); e.stopPropagation();
    isLoggedIn = a.dataset.auth === "login";
    renderAuth(); closeMember();
    toast(isLoggedIn ? "已登入（原型示意）" : "已登出");
    const y = window.scrollY; route(currentView); window.scrollTo(0, y);
  }, true);

  /* ================= 事件 ================= */
  const toastEl = document.getElementById("toast"); let tt;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove("show"), 1800); }

  document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    listState.type = btn.dataset.type; listState.page = 1; renderList();
  }));
  document.getElementById("sort").addEventListener("change", e => { listState.sort = e.target.value; listState.page = 1; renderList(); });
  document.getElementById("pager").addEventListener("click", e => {
    const b = e.target.closest("button[data-page]");
    if (!b || b.disabled) return;
    listState.page = Number(b.dataset.page); renderList(); window.scrollTo({ top: 0, behavior: "smooth" });
  });

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-favtab]");
    if (t) { favState.tab = t.dataset.favtab; renderFav(); return; }
    const os = e.target.closest("[data-orderstatus]");
    if (os) { orderState.status = os.dataset.orderstatus; orderState.page = 1; renderOrders(); return; }
    const op = e.target.closest("[data-orderpage]");
    if (op && !op.disabled) { orderState.page = Number(op.dataset.orderpage); renderOrders(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }

    const f = e.target.closest(".fav");
    if (!f) return;
    if (!isLoggedIn) { toast("請先登入會員才能收藏"); return; }
    const inFav = !document.getElementById("favMain").hidden && !document.getElementById("viewFav").hidden;
    if (f.dataset.kind === "event") {
      EVENTS.splice(EVENTS.findIndex(x => x.id === f.dataset.id), 1);
      renderFav(); toast("已取消收藏"); return;
    }
    const id = Number(f.dataset.id);
    const on = !favFunds.has(id);
    on ? favFunds.add(id) : favFunds.delete(id);
    toast(on ? "已收藏" : "已取消收藏");
    if (inFav) { renderFav(); return; }
    const title = FUNDS.find(d => d.id === id).title;
    f.setAttribute("aria-pressed", on);
    f.setAttribute("aria-label", `${on ? "取消收藏" : "收藏"}：${title}`);
    f.classList.remove("pop"); void f.offsetWidth; if (on) f.classList.add("pop");
  });

  const member = document.getElementById("member"), memberBtn = document.getElementById("memberBtn");
  function closeMember() { member.classList.remove("open"); memberBtn.setAttribute("aria-expanded", "false"); }
  memberBtn.addEventListener("click", e => { e.stopPropagation(); const o = member.classList.toggle("open"); memberBtn.setAttribute("aria-expanded", o); });
  document.addEventListener("click", e => { if (!member.contains(e.target)) closeMember(); });
  document.getElementById("menuToggle").addEventListener("click", e => {
    const o = document.getElementById("header").classList.toggle("open");
    e.currentTarget.setAttribute("aria-expanded", o);
  });

  // 顯示模式切換（預設淺色）
  document.querySelectorAll("[data-theme-set]").forEach(b => b.addEventListener("click", () => {
    document.documentElement.dataset.theme = b.dataset.themeSet;
    document.querySelectorAll("[data-theme-set]").forEach(x => x.setAttribute("aria-pressed", x === b));
  }));

  // TOP 按鈕：捲動超過 400px 才顯示
  const flTop = document.getElementById("flTop");
  const onScrollTop = () => { const on = window.scrollY > 400; flTop.hidden = !on; document.body.classList.toggle("top-on", on); };
  window.addEventListener("scroll", onScrollTop, { passive: true });
  flTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }));
  // 點擊浮動購物車以外的地方時收合
  document.addEventListener("click", e => {
    const p = document.getElementById("flPanel");
    if (!p || p.hidden || !e.target.isConnected) return;
    if (!e.target.closest("#flPanel, #flCart")) closeFloatCart();
  });

  renderAuth();
  route();
</script>
</body>
</html>
