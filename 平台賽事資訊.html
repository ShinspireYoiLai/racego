<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>賽事列表 – 後台畫面草稿</title>
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --line:#dde2e8; --text:#1d2733; --muted:#66727f;
  --brand:#1f5fbf; --brand-soft:#e6eefa;
  --ok:#1d7a4a; --ok-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fdf0d9;
  --bad:#b3261e; --bad-bg:#fbe7e5;
  --off:#5d6875; --off-bg:#eceff2; --live:#7a2fb0; --live-bg:#f2e8fa;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a20; --surface:#1d242c; --line:#2f3944; --text:#e4e9ee; --muted:#9aa6b2;
    --brand:#6fa3f0; --brand-soft:#22324a;
    --ok:#6fd19c; --ok-bg:#1c3529; --warn:#f1b860; --warn-bg:#3a2d17;
    --bad:#f2948c; --bad-bg:#3d2220;
    --off:#a7b1bc; --off-bg:#2a323b; --live:#c79bf0; --live-bg:#33243f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --bg:#151a20; --surface:#1d242c; --line:#2f3944; --text:#e4e9ee; --muted:#9aa6b2;
    --brand:#6fa3f0; --brand-soft:#22324a;
    --ok:#6fd19c; --ok-bg:#1c3529; --warn:#f1b860; --warn-bg:#3a2d17;
    --bad:#f2948c; --bad-bg:#3d2220;
    --off:#a7b1bc; --off-bg:#2a323b; --live:#c79bf0; --live-bg:#33243f;
    color-scheme: dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px;line-height:1.5}
.layout{display:flex;min-height:100vh}
aside{width:200px;background:var(--surface);border-right:1px solid var(--line);padding:20px 0;flex-shrink:0}
aside .logo{font-weight:700;font-size:17px;padding:0 20px 18px}
aside a{display:block;padding:9px 20px;color:var(--muted);text-decoration:none}
aside a.on{color:var(--brand);background:var(--brand-soft);font-weight:600;border-left:3px solid var(--brand);padding-left:17px}
main{flex:1;padding:24px 32px;min-width:0}
.crumb{color:var(--muted);margin-bottom:6px}
.crumb button{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;font:inherit}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}

/* 篩選區 */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.f.wide{grid-column:span 2}
.f input,.f select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);font:inherit;width:100%}
.range{display:flex;align-items:center;gap:6px}
.range input{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--text);cursor:pointer;font-size:13px}
.chips input{margin:0}
.ms{position:relative}
.ms-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer;text-align:left}
.ms-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-pop{position:absolute;z-index:20;top:calc(100% + 4px);left:0;width:max(100%,240px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:8px}
.ms-pop[hidden],.ms-list label[hidden],.ms-none[hidden]{display:none}
.ms-q{margin-bottom:6px}
.ms-list{max-height:220px;overflow-y:auto}
.ms-list label{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:5px;color:var(--text);cursor:pointer}
.ms-list label:hover{background:var(--bg)}
.ms-list label:has(input:checked){background:var(--brand-soft);color:var(--brand)}
.f input[type="checkbox"]{width:16px;height:16px;padding:0;margin:0;flex:none;accent-color:var(--brand);cursor:pointer}
.ms-list label{padding:7px 10px;line-height:1.4}
.ms-none{padding:10px 6px;color:var(--muted)}
.ms-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-size:12px;color:var(--muted)}
.ms-clear{background:none;border:0;color:var(--brand);cursor:pointer;font:inherit;padding:2px 4px}
.back{display:inline-flex;align-items:center;gap:6px;margin:2px 0 12px;padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.back:hover,.back:focus-visible{border-color:var(--brand);color:var(--brand)}
.fact{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.count{color:var(--muted)}

.btn{padding:8px 16px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:6px;cursor:pointer;font:inherit}
.btn.ghost{background:none;color:var(--brand)}
.link{background:none;border:1px solid var(--brand);color:var(--brand);border-radius:5px;padding:4px 12px;cursor:pointer;font:inherit;font-size:13px}
.link:hover,.link:focus-visible,.btn.ghost:hover{background:var(--brand-soft)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td .hint{display:block;font-size:12px;color:var(--muted);white-space:normal}
mark{background:var(--warn-bg);color:inherit;padding:0 2px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.s-open,.p-paid{background:var(--ok-bg);color:var(--ok)}
.s-soon{background:var(--brand-soft);color:var(--brand)}
.s-closed,.p-wait{background:var(--warn-bg);color:var(--warn)}
.s-live{background:var(--live-bg);color:var(--live)}
.s-end,.p-refund{background:var(--off-bg);color:var(--off)}
.p-fail{background:var(--bad-bg);color:var(--bad)}
.y{color:var(--ok);font-weight:600}
.n{color:var(--muted)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--muted);font-size:12px}
.empty{padding:40px;text-align:center;color:var(--muted);white-space:normal}
.foot{color:var(--muted);font-size:12px;margin-top:10px}
@media (max-width:760px){aside{display:none}main{padding:16px}.f.wide{grid-column:auto}}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="logo">RaceGo 後台</div>
    <a href="#">儀表板</a>
    <a href="#" class="on">賽事列表</a>
    <a href="#">會員管理</a>
    <a href="#">金流對帳</a>
    <a href="#">系統設定</a>
  </aside>
  <main id="app"></main>
</div>

<script>
// ===== 範例資料（僅示意）=====
const TODAY = '2026-10-30';
const PAY = ['統一金','街口'];
const PAY_STATUS = {free:['無須付款','p-refund'],wait:['待付款','p-wait'],filled:['已填匯款資料','s-soon'],paid:['已付款','p-paid'],refund:['已退款','p-refund'],overdue:['已逾期','p-fail'],fail:['付款失敗','p-fail']};
const REG_STATUS = {approved:['審核通過','p-paid'],pending:['待處理','p-wait'],rejected:['審核不通過','p-fail'],waitlist:['候補','s-soon'],hidden:['隱藏','p-refund']};
const STATUS = {soon:['即將開始','s-soon'],open:['報名中','s-open'],closed:['報名截止','s-closed'],end:['已結束','s-end']};
const organizers = [
  {id:1,name:'台北市羽球委員會',contact:'王小明',events:[
    {id:101,name:'2026 台北城市盃羽球錦標賽',sport:'羽球',start:'2026-12-12',end:'2026-12-13',regStart:'2026-10-01',regEnd:'2026-11-20',status:'open',vendors:['統一金','街口']},
    {id:102,name:'2026 春季羽球公開賽',sport:'羽球',start:'2026-04-18',end:'2026-04-19',regStart:'2026-02-01',regEnd:'2026-03-31',status:'end',vendors:['統一金']},
    {id:103,name:'2026 匹克球體驗賽',sport:'匹克球',start:'2026-09-06',end:'2026-09-06',regStart:'2026-07-15',regEnd:'2026-08-25',status:'end',vendors:[]},
    {id:104,name:'2025 秋季羽球聯誼賽',sport:'羽球',start:'2025-10-25',end:'2025-10-25',regStart:'2025-08-15',regEnd:'2025-10-01',status:'end',vendors:[]}]},
  {id:2,name:'新北籃球協會',contact:'陳怡君',events:[
    {id:201,name:'新北 3x3 街頭籃球賽',sport:'籃球',start:'2026-11-01',end:'2026-11-02',regStart:'2026-09-01',regEnd:'2026-10-15',status:'closed',vendors:['街口']},
    {id:202,name:'2027 新北青年盃籃球賽',sport:'籃球',start:'2027-02-20',end:'2027-02-22',regStart:'2026-12-01',regEnd:'2027-01-20',status:'soon',vendors:['統一金','街口']}]},
  {id:3,name:'台中桌球運動俱樂部',contact:'林志豪',events:[
    {id:301,name:'中台灣桌球團體賽',sport:'桌球',start:'2026-10-24',end:'2026-10-31',regStart:'2026-08-01',regEnd:'2026-09-30',status:'closed',vendors:[]}]},
  {id:4,name:'高雄排球推廣協會',contact:'張雅婷',events:[
    {id:401,name:'2026 港都盃沙灘排球賽',sport:'排球',start:'2026-12-05',end:'2026-12-06',regStart:'2026-10-10',regEnd:'2026-11-25',status:'open',vendors:['統一金']},
    {id:402,name:'2026 夏季排球邀請賽',sport:'排球',start:'2026-07-11',end:'2026-07-12',regStart:'2026-05-01',regEnd:'2026-06-20',status:'end',vendors:['街口']}]}
];
organizers.forEach(o=>o.events.forEach(e=>e.pay = e.vendors.length>0));
const SPORTS = ['羽球','籃球','桌球','排球','匹克球','網球','軟式網球','足球','五人制足球','棒球','壘球','田徑','路跑','越野跑','游泳','鐵人三項','自行車','跆拳道','柔道','空手道','射箭','保齡球','撞球','高爾夫','電競','飛盤','划船','滑板','攀岩','舞蹈'];
const groups = ['男子單打','女子單打','男子雙打','混合雙打','公開組'];
const teams = ['飛羽隊','逐風隊','藍鯨隊','閃電隊','晨光隊','北極星','山貓隊','火焰隊','海風隊','白鷺隊','黑熊隊','旋風隊'];
const people = ['李承翰','黃郁婷','吳冠廷','周佳穎','蔡明哲','許雅雯','鄭宇軒','謝欣怡','郭柏宏','洪詩涵','曾俊傑','劉思妤'];
const mails = ['chenghan','yuting','kuanting','chiaying','mingche','yawen','yuhsuan','hsinyi','pohung','shihhan','chunchieh','ssuyu'];

const pad = n => String(n).padStart(2,'0');
const toD = s => new Date(s+'T00:00:00');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const show = s => s.replace(/-/g,'/');
const range = (a,b) => a===b ? show(a) : `${show(a)}–${show(b).slice(a.slice(0,4)===b.slice(0,4)?5:0)}`;
const orgSports = o => [...new Set(o.events.map(e=>e.sport))];
const orgVendors = o => PAY.filter(p=>o.events.some(e=>e.vendors.includes(p)));
const orgLast = o => o.events.map(e=>e.start).sort().pop();

const regCache = {};
function regsFor(ev){
  if(ev.status==='soon') return [];
  if(regCache[ev.id]) return regCache[ev.id];
  const n = 8 + (ev.id % 7);
  const capEnd = ev.regEnd < TODAY ? ev.regEnd : TODAY;
  const span = Math.max(1, Math.round((toD(capEnd)-toD(ev.regStart))/864e5));
  const gwCycle = ['paid','paid','wait','paid','fail','paid','refund','overdue'];
  const tfCycle = ['paid','filled','wait','paid','overdue','paid','refund'];
  return regCache[ev.id] = Array.from({length:n},(_,i)=>{
    const k = (ev.id + i*3) % 12;
    const usePay = ev.pay && (ev.id + i) % 4 !== 0;
    const d = toD(ev.regStart); d.setDate(d.getDate() + Math.floor(span*i/n));
    return {no:`R${ev.id}${String(i+1).padStart(3,'0')}`, team:teams[k], member:people[(k+5)%12],
      phone:`09${pad(10+k*7%89)}-${String(100+k*37).slice(0,3)}-${String(200+i*41).slice(0,3)}`,
      email:`${mails[(k+5)%12]}@example.com`,
      group:groups[(ev.id+i)%groups.length], date:iso(d), time:`${iso(d)} ${pad(9+i%12)}:${pad((i*7)%60)}`,
      fee:[600,800,1200][i%3], pay:usePay, vendor:usePay?ev.vendors[(ev.id+i)%ev.vendors.length]:'匯款',
      payStatus:usePay?gwCycle[(ev.id+i)%8]:tfCycle[(ev.id+i)%7],
      regStatus:['approved','approved','pending','approved','waitlist','rejected','approved','hidden'][(ev.id+i*3)%8]};
  });
}

// ===== 篩選狀態 =====
const DEFAULTS = {
  orgs:{q:'',sport:[],st:'',from:'',to:'',pay:[]},
  events:{q:'',status:'',sport:[],dFrom:'',dTo:'',rFrom:'',rTo:'',pay:[]},
  regs:{q:'',group:'',pay:[],regStatus:'',payStatus:'',from:'',to:''}
};
let view = {page:'orgs', orgId:null, evId:null};
let F = {...DEFAULTS.orgs};
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = (s,q) => q ? esc(s).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`) : esc(s);
const inRange = (d,a,b) => (!a || d>=a) && (!b || d<=b);
const overlap = (s,e,a,b) => (!a || e>=a) && (!b || s<=b);

function go(v){
  if(v.page && v.page!==view.page) F = JSON.parse(JSON.stringify(DEFAULTS[v.page]));
  view = {...view,...v}; render(); window.scrollTo(0,0);
}
function resetFilters(){ F = JSON.parse(JSON.stringify(DEFAULTS[view.page])); render(); }

// 表單元件
const field = (label,html,wide,div) => div ? `<div class="f${wide?' wide':''}"><span>${label}</span>${html}</div>` : `<label class="f${wide?' wide':''}"><span>${label}</span>${html}</label>`;
const multi = (k,items,ph,name='賽事項目') => `<div class="ms" data-ms="${k}">
  <button type="button" class="ms-btn" aria-haspopup="listbox" aria-label="${name}"><span class="ms-label"></span><span aria-hidden="true">▾</span></button>
  <div class="ms-pop" hidden>
    ${ph?`<input type="text" class="ms-q" placeholder="${ph}" aria-label="${ph}">`:''}
    <div class="ms-list">${items.map(s=>`<label><input type="checkbox" value="${esc(s)}"${F[k].includes(s)?' checked':''}>${esc(s)}</label>`).join('')}<div class="ms-none" hidden>找不到符合的項目</div></div>
    <div class="ms-foot"><span class="ms-n"></span><button type="button" class="ms-clear">清除選取</button></div>
  </div></div>`;
const txt = (k,ph) => `<input type="text" data-f="${k}" value="${esc(F[k])}" placeholder="${ph}">`;
const sel = (k,opts) => `<select data-f="${k}">${opts.map(([v,t])=>`<option value="${esc(v)}"${F[k]===v?' selected':''}>${esc(t)}</option>`).join('')}</select>`;
const dates = (a,b) => `<span class="range"><input type="date" data-f="${a}" value="${F[a]}" aria-label="起始日"> 至 <input type="date" data-f="${b}" value="${F[b]}" aria-label="結束日"></span>`;
const ALL = [['','全部']];

let doSearch = ()=>{};
function bind(update){
  doSearch = update;
  app.querySelectorAll('[data-f]').forEach(el=>{
    el.addEventListener(el.type==='text'?'input':'change',()=>{ F[el.dataset.f]=el.value; });
    if(el.type==='text') el.addEventListener('keydown',ev=>{ if(ev.key==='Enter') doSearch(); });
  });
  app.querySelectorAll('[data-ms]').forEach(ms=>{
    const k = ms.dataset.ms, pop = ms.querySelector('.ms-pop'), q = ms.querySelector('.ms-q');
    const setLabel = ()=>{
      const v = F[k];
      ms.querySelector('.ms-label').textContent = !v.length ? '全部' : v.length<=2 ? v.join('、') : `已選 ${v.length} 項`;
      ms.querySelector('.ms-n').textContent = `已選 ${v.length} 項`;
    };
    ms.querySelector('.ms-btn').addEventListener('click',()=>{ pop.hidden = !pop.hidden; if(!pop.hidden && q) q.focus(); });
    if(q) q.addEventListener('input',()=>{
      const t = q.value.trim(); let any = false;
      ms.querySelectorAll('.ms-list label').forEach(l=>{ const hit = l.textContent.includes(t); l.hidden = !hit; any = any || hit; });
      ms.querySelector('.ms-none').hidden = any;
    });
    ms.querySelectorAll('.ms-list input').forEach(c=>c.addEventListener('change',()=>{
      F[k] = [...ms.querySelectorAll('.ms-list input:checked')].map(x=>x.value); setLabel();
    }));
    ms.querySelector('.ms-clear').addEventListener('click',()=>{
      ms.querySelectorAll('.ms-list input').forEach(c=>c.checked=false); F[k]=[]; setLabel();
    });
    setLabel();
  });
  app.querySelectorAll('[data-status]').forEach(el=>{
    el.addEventListener('change',()=>{
      F.status = [...app.querySelectorAll('[data-status]:checked')].map(x=>x.dataset.status);
    });
  });
}
function shell(crumb,title,sub,filterHtml,extraTop='',actions='',back=''){
  app.innerHTML = `
    <div class="crumb">${crumb}</div>
    ${back}
    <h1>${title}</h1>
    <p class="sub">${sub}</p>
    ${extraTop}
    <div class="filters">
      <div class="fgrid">${filterHtml}</div>
      <div class="fact"><span class="count" id="count"></span>
        <span style="display:flex;gap:8px"><button class="btn" onclick="doSearch()">搜尋</button><button class="btn ghost" onclick="resetFilters()">重置</button>${actions}</span></div>
    </div>
    <div class="card" id="results"></div>
    <div class="foot" id="foot"></div>`;
}

// ===== 1. 主辦方列表 =====
function renderOrgs(){
  shell('賽事列表','賽事列表','僅列出曾在網站舉辦過賽事的主辦方',
    field('關鍵字',txt('q','輸入主辦方或賽事名稱'),true) +
    field('賽事項目（可複選）',multi('sport',SPORTS,'搜尋賽事項目'),false,true) +
    field('賽事狀態',sel('st',ALL.concat(Object.entries(STATUS).map(([k,[t]])=>[k,t])))) +
    field('舉辦日期',dates('from','to'),true) +
    field('線上金流（可複選）',multi('pay',['未開通',...PAY],'','線上金流'),false,true));
  const update = ()=>{
    const q = F.q.trim();
    const rows = organizers.map(o=>{
      const matched = q ? o.events.filter(e=>e.name.includes(q)) : [];
      if(q && !o.name.includes(q) && !matched.length) return null;
      if(F.sport.length && !orgSports(o).some(s=>F.sport.includes(s))) return null;
      if(F.st && !o.events.some(e=>e.status===F.st)) return null;
      if((F.from||F.to) && !o.events.some(e=>overlap(e.start,e.end,F.from,F.to))) return null;
      const vs = orgVendors(o);
      if(F.pay.length && !F.pay.some(p=> p==='未開通' ? !vs.length : vs.includes(p))) return null;
      return {o,matched};
    }).filter(Boolean);
    document.getElementById('results').innerHTML = rows.length ? `
      <table><thead><tr><th>主辦方</th><th>賽事項目</th><th>聯絡人</th><th>舉辦賽事數</th><th>報名中</th><th>最近舉辦日期</th><th>線上金流</th><th>操作</th></tr></thead><tbody>
      ${rows.map(({o,matched})=>`<tr>
        <td>${hl(o.name,q)}${matched.length?`<span class="hint">符合賽事：${matched.map(e=>hl(e.name,q)).join('、')}</span>`:''}</td>
        <td>${orgSports(o).join('、')}</td>
        <td>${esc(o.contact)}</td>
        <td>${o.events.length}</td>
        <td>${o.events.filter(e=>e.status==='open').length}</td>
        <td>${show(orgLast(o))}</td>
        <td>${orgVendors(o).length?orgVendors(o).join('、'):'<span class="n">-</span>'}</td>
        <td><button class="link" onclick="go({page:'events',orgId:${o.id}})">賽事</button></td>
      </tr>`).join('')}</tbody></table>`
      : `<div class="empty">沒有符合條件的主辦方，請調整篩選條件。</div>`;
    document.getElementById('count').textContent = `符合 ${rows.length} / ${organizers.length} 個主辦方`;
  };
  bind(update); update();
}

// ===== 2. 賽事列表 =====
function renderEvents(){
  const o = organizers.find(x=>x.id===view.orgId);
  shell(`<button onclick="go({page:'orgs'})">賽事列表</button> ／ ${esc(o.name)}`, esc(o.name), '此主辦方在網站舉辦過的所有賽事',
    field('賽事名稱',txt('q','輸入賽事名稱')) +
    field('賽事項目（可複選）',multi('sport',orgSports(o),'搜尋賽事項目'),false,true) +
    field('金流（可複選）',multi('pay',['匯款',...PAY],'','金流'),false,true) +
    field('賽事狀態',sel('status',ALL.concat(Object.entries(STATUS).map(([k,[t]])=>[k,t])))) +
    field('比賽日期',dates('dFrom','dTo'),true) +
    field('報名期間',dates('rFrom','rTo'),true),
    '','',`<div><button class="back" onclick="go({page:'orgs'})"><span aria-hidden="true">←</span> 返回主辦方列表</button></div>`);
  const update = ()=>{
    const q = F.q.trim();
    const list = o.events.filter(e=>
      (!q || e.name.includes(q)) && (!F.sport.length || F.sport.includes(e.sport)) &&
      (!F.status || e.status===F.status) &&
      (!F.pay.length || F.pay.some(p=> p==='匯款' ? !e.vendors.length : e.vendors.includes(p))) &&
      overlap(e.start,e.end,F.dFrom,F.dTo) && overlap(e.regStart,e.regEnd,F.rFrom,F.rTo));
    document.getElementById('results').innerHTML = list.length ? `<table>
      <thead><tr><th>賽事名稱</th><th>賽事項目</th><th>比賽日期</th><th>報名期間</th><th>報名數</th><th>使用金流</th><th>狀態</th><th>操作</th></tr></thead>
      <tbody>${list.map(e=>{const [t,c]=STATUS[e.status];return `<tr>
        <td>${hl(e.name,q)}</td><td>${e.sport}</td><td>${range(e.start,e.end)}</td><td>${range(e.regStart,e.regEnd)}</td>
        <td>${regsFor(e).length}</td>
        <td>${e.vendors.length?e.vendors.join('、'):'匯款'}</td>
        <td><span class="tag ${c}">${t}</span></td>
        <td>${e.status==='soon'?'<span class="n">尚無報名</span>':`<button class="link" onclick="go({page:'regs',evId:${e.id}})">報名清單</button>`}</td>
      </tr>`}).join('')}</tbody></table>`
      : `<div class="empty">沒有符合條件的賽事，請調整篩選條件。</div>`;
    document.getElementById('count').textContent = `符合 ${list.length} / ${o.events.length} 場賽事`;
  };
  bind(update); update();
}

// ===== 3. 報名清單 =====
let currentRegs = [];
function renderRegs(){
  const o = organizers.find(x=>x.id===view.orgId);
  const e = o.events.find(x=>x.id===view.evId);
  const all = regsFor(e);
  const [t,c] = STATUS[e.status];
  const methods = ['匯款',...e.vendors];
  const usedGroups = [...new Set(all.map(r=>r.group))];
  const stats = `<div class="stats">
      <div class="stat"><b>${all.length}</b><span>總報名數</span></div>
      ${methods.map(p=>`<div class="stat"><b>${all.filter(r=>r.vendor===p).length}</b><span>${p}</span></div>`).join('')}
    </div>`;
  shell(`<button onclick="go({page:'orgs'})">賽事列表</button> ／ <button onclick="go({page:'events'})">${esc(o.name)}</button> ／ 報名清單`,
    `${esc(e.name)} <span class="tag ${c}" style="vertical-align:middle">${t}</span>`,
    `比賽日期 ${range(e.start,e.end)}　報名期間 ${range(e.regStart,e.regEnd)}`,
    field('關鍵字',txt('q','訂單編號、隊名、會員姓名、手機、Email'),true) +
    field('組別',sel('group',ALL.concat(usedGroups.map(g=>[g,g])))) +
    field('付款方式（可複選）',multi('pay',methods,'','付款方式'),false,true) +
    field('報名狀態',sel('regStatus',ALL.concat(Object.entries(REG_STATUS).map(([k,[t]])=>[k,t])))) +
    field('付款狀態',sel('payStatus',ALL.concat(Object.entries(PAY_STATUS).map(([k,[t]])=>[k,t])))) +
    field('報名時間',dates('from','to'),true),
    stats, `<button class="btn" id="exportBtn" onclick="exportCsv()"${downloadsApi?'':' hidden'}>匯出 Excel</button>`,
    `<div><button class="back" onclick="go({page:'events'})"><span aria-hidden="true">←</span> 返回賽事列表</button></div>`);
  const update = ()=>{
    const q = F.q.trim().toLowerCase();
    currentRegs = all.filter(r=>
      (!q || [r.no,r.team,r.member,r.phone,r.email].some(v=>v.toLowerCase().includes(q))) &&
      (!F.group || r.group===F.group) &&
      (!F.pay.length || F.pay.includes(r.vendor)) &&
      (!F.regStatus || r.regStatus===F.regStatus) &&
      (!F.payStatus || r.payStatus===F.payStatus) &&
      inRange(r.date,F.from,F.to));
    const qq = F.q.trim();
    document.getElementById('results').innerHTML = `<table>
      <thead><tr><th>訂單編號</th><th>隊名</th><th>報名會員</th><th>組別</th><th>報名時間</th><th>報名費</th><th>報名狀態</th><th>付款方式</th><th>付款狀態</th></tr></thead>
      <tbody>${currentRegs.length?currentRegs.map(r=>`<tr>
        <td>${hl(r.no,qq)}</td><td>${hl(r.team,qq)}</td>
        <td>${hl(r.member,qq)}<span class="hint">${hl(r.phone,qq)}　${hl(r.email,qq)}</span></td>
        <td>${r.group}</td><td>${show(r.time)}</td><td>NT$ ${r.fee}</td>
        <td><span class="tag ${REG_STATUS[r.regStatus][1]}">${REG_STATUS[r.regStatus][0]}</span></td>
        <td>${r.vendor}</td>
        <td><span class="tag ${PAY_STATUS[r.payStatus][1]}">${PAY_STATUS[r.payStatus][0]}</span></td>
      </tr>`).join(''):`<tr><td colspan="9" class="empty">沒有符合條件的報名資料，請調整篩選條件。</td></tr>`}</tbody></table>`;
    document.getElementById('count').textContent = `符合 ${currentRegs.length} / ${all.length} 筆報名`;
    document.getElementById('foot').textContent = '※ 資料為示意；匯出會套用目前的篩選條件';
  };
  bind(update); update();
}

let downloadsApi = null;
if(window.claude && typeof window.claude.use==='function'){
  window.claude.use('downloads').then(d=>{ downloadsApi = d; const b=document.getElementById('exportBtn'); if(b) b.hidden = !d; }).catch(()=>{});
}
async function exportCsv(){
  if(!downloadsApi) return;
  const e = organizers.find(x=>x.id===view.orgId).events.find(x=>x.id===view.evId);
  const head = ['訂單編號','隊名','報名會員','手機','Email','組別','報名時間','報名費','報名狀態','付款方式','付款狀態'];
  const rows = currentRegs.map(r=>[r.no,r.team,r.member,r.phone,r.email,r.group,show(r.time),r.fee,REG_STATUS[r.regStatus][0],r.vendor,PAY_STATUS[r.payStatus][0]]);
  const csv = '\ufeff' + [head,...rows].map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  try{ await downloadsApi.save({filename:`${e.name}_報名清單.csv`, data:csv}); }catch(err){ if(err && err.code==='unavailable'){ const b=document.getElementById('exportBtn'); if(b) b.hidden=true; } }
}

document.addEventListener('click',ev=>{ document.querySelectorAll('.ms').forEach(ms=>{ if(!ms.contains(ev.target)) ms.querySelector('.ms-pop').hidden = true; }); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape') document.querySelectorAll('.ms-pop').forEach(p=>p.hidden=true); });

function render(){ ({orgs:renderOrgs,events:renderEvents,regs:renderRegs})[view.page](); }
render();
</script>
</body>
</html>
